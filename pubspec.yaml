name: news_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cached_network_image: ^4.0.4 #agar siza gambar tidak terlalu besar, dan tidak susah di load
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # Berisi API key. File ini di-ignore oleh git (lihat .env.example).
    - .env

# Logo aplikasi → jalankan: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/logo_kabarin.png
  adaptive_icon_background: "#fefefe"
  adaptive_icon_foreground: assets/logo/logo_kabarin_transparan.png
  remove_alpha_ios: true

# Splash screen native → jalankan: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#fefefe"
  image: assets/logo/logo_kabarin_transparan.png

  android: true
  ios: true

  android_12:
    color: "#fefefe"
    image: assets/logo/logo_kabarin_transparan.png
    icon_background_color: "#fefefe"

  fullscreen: false
